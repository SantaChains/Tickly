name: Build Tickly Portable EXE

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# 同一分支/标签的重复触发只保留最新一次，避免连续 push 堆积构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认只读：构建任务不需要写权限；发布任务单独提权到 contents: write
permissions:
  contents: read

jobs:
  build-msvc:
    # windows-latest 预装 Visual Studio + Windows SDK + Ninja，无需再装 MSYS2/MinGW
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 把 cl.exe / rc.exe / link.exe 及其环境变量注入后续步骤
      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 版本号唯一来源是 src/app/version.h；CMake 会在配置阶段校验
      # resource.rc 的 FILEVERSION 与 app.manifest 的 assemblyIdentity
      # 是否与之一致（不一致直接配置失败，而不是产出互相矛盾的 exe）
      - name: Build (Release, static CRT, single exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake 配置失败" }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { throw "编译失败" }
          Get-Item build/Tickly.exe | Select-Object Name, Length | Format-Table

      # 在线打包踩过的两个坑：图标资源 ID 不对（窗口没图标）、清单没链上（文字发虚）。
      # 这里用「程序真实取图标的方式」（LoadIcon(ID=1)）直接验证，避免以后改 CI 又回归
      - name: Verify icon (ID 1) + DPI manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import ctypes, os, sys

          exe = os.path.join("build", "Tickly.exe")
          if not os.path.exists(exe):
              sys.exit("Tickly.exe 未生成")

          k = ctypes.WinDLL("kernel32", use_last_error=True)
          k.LoadLibraryExW.restype = ctypes.c_void_p
          k.LoadLibraryExW.argtypes = [ctypes.c_wchar_p, ctypes.c_void_p, ctypes.c_uint32]
          u = ctypes.WinDLL("user32", use_last_error=True)
          u.LoadIconW.restype = ctypes.c_void_p
          u.LoadIconW.argtypes = [ctypes.c_void_p, ctypes.c_void_p]

          # LOAD_LIBRARY_AS_DATAFILE = 0x2：把 exe 当资源库打开，和程序运行时一致
          h = k.LoadLibraryExW(exe, None, 0x2)
          if not h:
              sys.exit("无法以资源方式打开 exe")
          if not u.LoadIconW(ctypes.c_void_p(h), ctypes.c_void_p(1)):
              sys.exit("exe 里没有 ID=1 的图标组 -> 窗口/任务栏/托盘会显示系统默认图标")
          print("OK: icon group id 1 found")

          data = open(exe, "rb").read()
          if b"PerMonitorV2" not in data:
              sys.exit("exe 里没有 DPI 感知清单 -> 非 100% 缩放下文字会被位图拉伸发虚")
          print("OK: DPI manifest embedded (PerMonitorV2)")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "资源校验失败" }

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Tickly-portable
          path: build/Tickly.exe
          if-no-files-found: error

  # MinGW 是 README 里写明的第二种构建方式，但之前没有 CI 覆盖：
  # CMake 的 mingw 分支（manifest.rc / mingw64.specs）只有真正编译一次才靠得住
  build-mingw:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Build (Release, static, single exe)
        run: |
          set -e
          cmake -S . -B build-mingw -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-mingw
          test -f build-mingw/Tickly.exe

  # 发布独立成 job：只有 tag 触发时才需要 contents: write，
  # 构建与 PR 校验始终用只读令牌
  release:
    needs: [ build-msvc ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download portable EXE
        uses: actions/download-artifact@v4
        with:
          name: Tickly-portable

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Tickly.exe
